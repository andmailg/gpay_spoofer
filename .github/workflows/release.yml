name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | head -1 | cut -d'=' -f2 | sed 's/ .*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create ZIP archive
        id: zip
        env:
          ARCHIVE_NAME: gpay-spoofer-v${{ steps.version.outputs.version }}.zip
        run: |
          python3 << 'PYEOF'
          import zipfile, os, glob
          
          archive = os.environ['ARCHIVE_NAME']
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              def add_file_with_perms(filepath, arcname):
                  st = os.stat(filepath)
                  # Читаем права из ОС и сдвигаем их в старшие 16 бит external_attr
                  attr = (st.st_mode & 0xFFFF) << 16
                  
                  # Создаем ZipInfo вручную, чтобы сохранить права
                  zinfo = zipfile.ZipInfo.from_file(filepath, arcname)
                  zinfo.external_attr = attr
                  zinfo.compress_type = zipfile.ZIP_DEFLATED
                  
                  with open(filepath, 'rb') as f:
                      z.writestr(zinfo, f.read())

              for item in glob.glob('*'):
                  if item not in ('.git', '.github', archive) and not item.endswith('.zip'):
                      if os.path.isdir(item):
                          for root, dirs, files in os.walk(item):
                              for f in files:
                                  filepath = os.path.join(root, f)
                                  arcname = os.path.relpath(filepath, '.')
                                  add_file_with_perms(filepath, arcname)
                      else:
                          add_file_with_perms(item, item)
          
          print(f"Created: {archive}")
          PYEOF
          
          ls -lh "${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GPay-Spoofer v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: "${{ steps.zip.outputs.archive_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
