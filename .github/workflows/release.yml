name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | head -1 | cut -d'=' -f2 | sed 's/ .*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create ZIP archive
        id: zip
        env:
          ARCHIVE_NAME: gpay-spoofer-v${{ steps.version.outputs.version }}.zip
        run: |
          python3 << 'PYEOF'
          import zipfile, os, shutil, glob
          
          tmpdir = 'gpay_module'
          if os.path.exists(tmpdir):
              shutil.rmtree(tmpdir)
          os.makedirs(tmpdir)
          
          for item in glob.glob('*'):
              if item not in ('.git', '.github'):
                  src = os.path.join(tmpdir, item)
                  if os.path.isdir(item):
                      shutil.copytree(item, src)
                  else:
                      shutil.copy2(item, tmpdir)
          
          archive = os.environ['ARCHIVE_NAME']
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(tmpdir):
                  for f in files:
                      filepath = os.path.join(root, f)
                      arcname = os.path.relpath(filepath, tmpdir)
                      z.write(filepath, arcname)
          
          shutil.rmtree(tmpdir)
          print(f"Created: {archive}")
          PYEOF
          
          ls -lh "${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GPay-Spoofer v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: "${{ steps.zip.outputs.archive_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
