name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | head -1 | cut -d'=' -f2 | sed 's/ .*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create ZIP archive
        id: zip
        env:
          ARCHIVE_NAME: gpay-spoofer-v${{ steps.version.outputs.version }}.zip
        run: |
          # Убедимся, что все .sh файлы имеют права 755 прямо перед упаковкой
          # find . -name "*.sh" -exec chmod +x {} +
          
          # Упаковываем все файлы в архив, исключая служебные директории и сам архив
          zip -r "${ARCHIVE_NAME}" . -x ".git/*" ".github/*" "*.zip"
          
          ls -lh "${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GPay-Spoofer v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: "${{ steps.zip.outputs.archive_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false