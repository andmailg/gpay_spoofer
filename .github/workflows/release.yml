name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | head -1 | cut -d'=' -f2 | sed 's/ .*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create ZIP archive
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="gpay-spoofer-v${VERSION}.zip"
          # Создаём временную директорию без .git
          TMP_DIR=$(mktemp -d)
          cp -r * "$TMP_DIR/" 2>/dev/null
          cp .gitignore "$TMP_DIR/" 2>/dev/null || true
          rm -rf "$TMP_DIR/.git"
          # Архивируем содержимое в текущий каталог (репозиторий)
          (cd "$TMP_DIR" && zip -r "${ARCHIVE_NAME}" .)
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "Created: $ARCHIVE_NAME"
          ls -lh "${ARCHIVE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GPay-Spoofer v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: "${{ steps.zip.outputs.archive_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
