name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | head -1 | cut -d'=' -f2 | sed 's/ .*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create ZIP archive
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="gpay-spoofer-v${VERSION}.zip"
          # Удаляем ненужные файлы
          rm -rf .git .github
          # Архивируем всё что осталось
          zip -r "${ARCHIVE_NAME}" .
          ls -lh "${ARCHIVE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "GPay-Spoofer v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: "${{ steps.zip.outputs.archive_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
